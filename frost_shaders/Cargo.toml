[package]
name = "frost_shaders"
version = "0.1.0"
edition = "2024"

# The shelf for reusable frost shader programs: sources a game can
# hang on a shape with `Shape::with_program` / `Shape::painted_by`
# without owning the WGSL itself. A program here belongs to no one
# game — antifrost borrowed the dig's dissolve from this shelf, and
# the example below is the smallest host that shows it working.

# The library needs none of this: the shelf's whole API is `&str`s of
# WGSL, and a game that borrows a program links frost on its own
# account — a plain dependency made the library claim the whole engine
# for its runtime surface and read as "unused" to every tool that
# checks what the library target actually names. The engine belongs on
# the dev side, where it does real work: the contract test walks
# `frost::LIGHTING_WGSL` and `validate_wgsl`, and the dissolve example
# is a whole host window on it. The library's prose names those engine
# items in code text rather than linking them, because cargo does not
# pass dev-dependencies to rustdoc (three unresolved-link warnings when
# they were links; re-verified on 1.99).
[dev-dependencies]
frost = { path = ".." }

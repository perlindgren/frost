[package]
name = "frost_shaders"
version = "0.1.0"
edition = "2024"

# The shelf for reusable frost shader programs: sources a game can
# hang on a shape with `Shape::with_program` / `Shape::painted_by`
# without owning the WGSL itself. A program here belongs to no one
# game — antifrost borrowed the dig's dissolve from this shelf, and
# the example below is the smallest host that shows it working.

# This dependency reads as unused to any tool that looks at the
# library target alone — and that target genuinely does not need the
# engine: the shelf's whole API is a `&str` of WGSL, and a game that
# borrows it links frost on its own account. The engine is still a
# real dependency of the crate: the contract test calls
# `frost::LIGHTING_WGSL` and `frost::validate_wgsl`, the dissolve
# example is a whole frost host, and the library's own documentation
# links into the engine's items. Dev-dependencies are tried and
# rejected for the last of these: cargo does not pass them to rustdoc,
# and those links turn to text (`unresolved link to frost::...` x3).
# A plain dependency is the one classification all four users share.
[dependencies]
frost = { path = ".." }

[package]
name = "nice-clap-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Project-owned CLAP hosting adapter for nice-rack"

[[test]]
name = "nam_unload"
harness = false

[dependencies]
rack-ipc = { path = "../nice-rack/crates/ipc" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
winit = "0.30.13"
raw-window-handle = "0.6"
rtrb = "0.4"
nice-rack-engine = { path = "../nice-rack-engine" }
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "state", "latency", "gui", "params", "raw-window-handle_06"] }

[target.'cfg(windows)'.dependencies]
# Read a plugin window's style and show it asynchronously if needed; see
# `ensure_editor_child_shown` in src/controls.rs. Version
# and features match the one `nice-tuner/crates/window-position` already uses, so
# this adds no new crate to the lock.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
allocation-counter = "=0.8.1"

[package]
name = "nice-clap-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Project-owned CLAP hosting adapter for nice-rack"

[[test]]
name = "nam_unload"
harness = false

[dependencies]
raw-window-handle = "0.6"
rtrb = "0.4"
nice-rack-engine = { path = "../nice-rack-engine" }
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "state", "latency", "gui", "params", "raw-window-handle_06"] }

[target.'cfg(windows)'.dependencies]
# Public Win32 show/paint operations for embedded editor children. No private
# toolkit messages are used. Versions stay aligned with window-position.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
allocation-counter = "=0.8.1"

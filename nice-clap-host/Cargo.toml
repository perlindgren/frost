[package]
name = "nice-clap-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Project-owned CLAP hosting adapter for nice-rack"

[dependencies]
raw-window-handle = "0.6"
rtrb = "0.4"
nice-rack-engine = { path = "../nice-rack-engine" }
clack-host = "=0.2.0"
clack-extensions = { version = "=0.2.0", features = ["clack-host", "audio-ports", "state", "latency", "gui", "params", "raw-window-handle_06"] }

[target.'cfg(windows)'.dependencies]
# Reading a plugin's window style and asking Windows to show that window; see
# `ensure_editor_child_shown` in src/controls.rs. Version
# and features match the one `nice-tuner/crates/window-position` already uses, so
# this adds no new crate to the lock.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
allocation-counter = "=0.8.1"

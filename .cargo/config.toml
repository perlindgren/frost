[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo xtask bundle <plugin> --release` — the plugin's bundling step, whose
# driver lives in `nice-tuner/xtask`. An alias here is visible from every
# directory in the workspace; a member's own `.cargo/config.toml` would not be,
# because cargo reads config from the working directory *upward* and both the
# hooks and the gate run at this root.
[alias]
xtask = "run --package xtask --"

# Deliberately no `[env] CPAL_ASIO_DIR` here, and no path to any SDK.
#
# Nothing in this workspace reads that variable any more. Windows ASIO is `azo`,
# whose FFI layer — `azo-sys` — declares the COM interfaces by hand: no C++, no
# Steinberg tree to point at. `azo` itself does run a build script, and it wants
# a `rustfmt` binary on PATH to format the bindings it generates from metadata
# vendored in the crate; it compiles no C++ and downloads nothing. The gate's
# Windows toolchain names that component, which is why the gate can build a
# Windows `--features standalone` on every push — the thing this entry used to
# make awkward. `nice-common/Cargo.toml` has the detail. Why it was never a good idea is kept below, because it is the
# reason not to add one back for the next dependency that grows an SDK:
#
# `asio-sys`, the crate this variable belonged to, finds the ASIO SDK in three
# steps, in order: use `CPAL_ASIO_DIR` if it is set — without checking that the
# path exists — else use `<temp>/asio_sdk` if the SDK is already unpacked there,
# else download it from https://www.steinberg.net/asiosdk and unpack it there.
# cpal's README ends that section "in an ideal situation you don't need to worry
# about this step", and an entry in this file takes all three away: it
# *selects step one*, silently disarming the fallback. That is exactly how it
# failed while this entry existed — it pointed at `.cargohome/asiosdk`, a path
# carried over from the plugin's previous repository that does not exist here,
# asio-sys compiled against three nonexistent `-I` directories, and the error was
# a wall of `cl.exe` arguments rather than one sentence about a missing SDK.
#
# Whether step three works depends on the machine, and the reason is upstream.
# asio-sys 0.4.0 builds its download command as
#
#     powershell -NoProfile -Command "Invoke-WebRequest -Uri <url> -OutFile <path>"
#
# with `<path>` interpolated unquoted (build.rs:303-311), so a `%TEMP%` under a
# user name containing a space — most Windows names, this one included — is
# split by PowerShell into `PositionalParameterNotFound` and then
# `panic!("Failed to download ASIO SDK")`. Measured on this machine both ways,
# same folder, two spellings: `C:\Users\Per Lindgren\...` fails as above,
# `C:\Users\PERLIN~1\...` downloads 8,910,208 bytes, unpacks 48 files with
# `asio.h`, and builds in 32.9 s. So zero-configuration was genuinely available,
# just not from a path with a space in it, and the one-line upstream fix — quote
# the path — is recorded in `TODO.md` as cpal's to make, not this file's.
#
# The SDK's licence is proprietary and this repository is `MIT OR Apache-2.0`,
# which is a reason to keep it out of the *tree* — where the ignore rule and the
# two guards (`.githooks/pre-commit`, the gate's own assertion) stand — and no
# reason at all left to configure a path to it. `<temp>` is not the tree.

# Windows builds default to a static C runtime. The binary-release workflow
# explicitly retains +crt-static alongside its x86-64-v3 optimization flags,
# because RUSTFLAGS overrides this target configuration. Its import checks reject
# dynamic MSVC/UCRT and unreviewed external DLL dependencies in the distributed
# plugins and executables. Windows system DLLs and audio drivers remain external.
# Each module owns its runtime state; allocation ownership across plugin ABI
# boundaries must continue to follow the host/plugin API's rules.

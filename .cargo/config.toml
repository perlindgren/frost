[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# `cargo xtask bundle <plugin> --release` — the plugin's bundling step, whose
# driver lives in `nice-tuner/xtask`. An alias here is visible from every
# directory in the workspace; a member's own `.cargo/config.toml` would not be,
# because cargo reads config from the working directory *upward* and both the
# hooks and the gate run at this root.
[alias]
xtask = "run --package xtask --"

# Deliberately no `[env] CPAL_ASIO_DIR` here, and putting one back would break
# the very thing it looks like it configures.
#
# `asio-sys` finds the ASIO SDK in three steps, in order: use `CPAL_ASIO_DIR` if
# it is set — without checking that the path exists — else use `<temp>/asio_sdk`
# if the SDK is already unpacked there, else download it from
# https://www.steinberg.net/asiosdk and unpack it there. cpal's README ends that
# section "in an ideal situation you don't need to worry about this step", and
# an entry in this file takes all three away: it *selects step one*, silently
# disarming the fallback. That is exactly how it failed while this entry existed
# — it pointed at `.cargohome/asiosdk`, a path carried over from the plugin's
# previous repository that does not exist here, asio-sys compiled against three
# nonexistent `-I` directories, and the error was a wall of `cl.exe` arguments
# rather than one sentence about a missing SDK.
#
# Whether step three works depends on the machine, and the reason is upstream.
# asio-sys 0.4.0 builds its download command as
#
#     powershell -NoProfile -Command "Invoke-WebRequest -Uri <url> -OutFile <path>"
#
# with `<path>` interpolated unquoted (build.rs:303-311), so a `%TEMP%` under a
# user name containing a space — most Windows names, this one included — is
# split by PowerShell into `PositionalParameterNotFound` and then
# `panic!("Failed to download ASIO SDK")`. Measured on this machine both ways,
# same folder, two spellings: `C:\Users\Per Lindgren\...` fails as above,
# `C:\Users\PERLIN~1\...` downloads 8,910,208 bytes, unpacks 48 files with
# `asio.h`, and builds in 32.9 s. So zero-configuration is genuinely available,
# just not from a path with a space in it, and neither remedy is a repository
# fact: a space-free temp dir, or `CPAL_ASIO_DIR` set in the developer's own
# environment, where it wins because it is theirs and not ours. The one-line
# upstream fix — quote the path — is recorded in `TODO.md`.
#
# Nothing here needs the SDK either. ASIO sits behind the `standalone-asio`
# feature; no step in the hooks or the gate builds it, so no CI machine ever
# fetches it, and no step anywhere uses `--all-features`.
#
# The SDK's licence is proprietary and this repository is `MIT OR Apache-2.0`,
# which is a reason to keep it out of the *tree* — where the ignore rule and the
# two guards (`.githooks/pre-commit`, the gate's own assertion) stand — and no
# reason to configure a path to it. `<temp>` is not the tree.

# A decision written down rather than inherited. That `+crt-static` above is the
# engine's own choice — a game that ships as one file with no VC redist to
# install — and the plugin joined this workspace under it. A VST3 `.dll` built
# with a static CRT carries its own C runtime and heap beside the host's, which
# is a thing a plugin is generally advised not to do; the standalone binary the
# SDK examples ship is built without it. Nothing here has been measured against
# a real host, so the honest state is: this flag now applies to the plugin, and
# a bundle you intend to load in somebody's DAW should be built without it,
# explicitly, for that one command —
#
#     $env:RUSTFLAGS = ""        # the environment wins over `rustflags` above
#     cargo xtask bundle nice-tuner --release
#
# and measured in a host before it is trusted either way.

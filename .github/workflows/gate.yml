# The gate that does not depend on anyone's clone.
#
# `.githooks/` is real but optional: it lives in per-clone config, `--no-verify`
# walks past it, and `git merge` never invokes `pre-commit` at all. This is the
# copy of the same rules that runs whether or not the machine that pushed wanted
# it to. What it enforces is what a machine without a display can honestly
# enforce; the parts it cannot judge are named below and in the step names, not
# quietly omitted.
#
# Two runners, each pinned to a named image rather than a `-latest` label:
# `ubuntu-24.04`, which moved its image on 19 October 2026 without asking, and
# `windows-2025`, the platform this engine is developed and shipped on. A gate whose
# machine shifts underneath it silently is §37 in a different costume, and the image
# carries the system libraries, linker and toolchain this file judges code with.
#
# The Windows job is the recent one, and the reason it took so long is written into
# the comments below: Windows ASIO came from cpal's `asio` feature, whose build script
# compiles the Steinberg SDK — proprietary, refused in-tree by the scan below, and in
# no clean checkout. A Windows runner could build this engine and could not build
# anything with `--features standalone`, so the flag was left out everywhere, in this
# file and in `.githooks/` alike, and the shipping platform's audio code was compiled
# on whoever's machine felt like it and nowhere else. The transport is `azo` now,
# whose FFI layer declares the ASIO COM interfaces by hand (`azo-sys 0.4.1`: one
# `lib.rs`, no build script, no C++), so there is no SDK to fetch and the second
# platform costs minutes rather than a licence.
#
# Both ways this file has failed are on the record, because each taught something:
# the commit that introduced it was rejected before a job existed, a Rust module path
# ending a YAML line having read as a key indicator; the run after died twenty-six
# seconds into clippy for want of the ALSA and udev headers. A gate that cannot start
# and a gate that cannot build look identical from the commit list unless someone
# writes it down.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A branch pushed twice in a minute does not need two gates finishing. The
# second run is the truth about the branch and the first is only evidence about a
# commit that no longer exists, so the older one is cancelled rather than left to
# spend five minutes proving something nobody will read. Scoped per ref: a push to
# `main` and a push to a branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Pinned rather than `ubuntu-latest`, which migrated its image on 19 October
    # 2026 without asking anyone: a gate whose machine changes underneath it
    # silently is §37 in a different costume, and the runner image carries the
    # system libraries, the linker and the toolchain this file judges code with.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The check `.githooks/pre-commit` runs, in the same spirit: nothing here
      # needs a display, a GPU, or a process list that answers.
      - name: No OS or build droppings in the tree
        run: |
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|._[^/]+)$|__pycache__/|\.pyc$'; then
            echo '::error::tracked files above are droppings; git rm --cached them and delete them.'
            exit 1
          fi

      # The same question `.githooks/pre-commit` asks, for a push from a clone
      # that never installed the hooks. A cargo home is a cache, and the Steinberg
      # ASIO SDK ends up in one wherever a build is pointed at it — which in this
      # tree meant cpal's `asio` feature until the azo transport replaced it, and a
      # neighbouring project still using that feature does the same thing today. A
      # `git add -A` next to a plugin project sweeps exactly that directory in. The
      # SDK is proprietary and this repository is `MIT OR Apache-2.0`, so one commit
      # containing it publishes someone else's licensed tree from a public repo,
      # which no amount of force-pushing afterwards undoes.
      - name: No third-party proprietary SDK in the tree
        run: |
          if git ls-files | grep -E '(^|/)\.cargohome/|(^|/)asiosdk/|(^|/)(asio\.h|iasiodrv\.h|asiodrvr\.cpp|asiolist\.cpp|hostsample\.cpp)$|[Ss]teinberg'; then
            echo '::error::Steinberg ASIO SDK files above are proprietary and this repository is MIT OR Apache-2.0; git rm --cached them and point CPAL_ASIO_DIR outside the tree.'
            exit 1
          fi

      # Pinned for the same reason as the runner above, and this pin was paid
      # for: rustc 1.100.0 was released on 12 November 2026, and a gate run on
      # it at 20:38Z failed step by step on `needless_range_loop` hits in
      # `antifrost`, `immortal` and `tools/sprite_util` — code the branch had
      # not touched — while the identical tree on the previous stable had been
      # green seven and a half hours earlier. A `@stable` tag is a moving
      # window into someone else's release calendar; the day clippy learns a
      # new rule is a decision about this repository, so it should arrive as
      # a commit, made beside a local toolchain that answers the same
      # questions, and not as a red run on an unrelated branch. Bumping the
      # pin means: install that toolchain locally, run the gate, fix what the
      # new clippy says, change the number, all in one commit.
      #
      # Swapping `@stable` for a version number has one twist the first pinned
      # run found the hard way. The action installs with `--profile minimal`
      # and adds nothing else unless it is named: `@stable` only ever carried
      # rustfmt and clippy because the runner image ships a full-profile stable
      # and reinstalling the toolchain that is already there removes nothing.
      # A pinned version arrives fresh and minimal, and `cargo fmt` then dies
      # through rustup's proxy before reading a single file — exit 1, no diff,
      # unreproducible on any real machine. So the components the gate judges
      # with are named beside the pin. The bump ritual covers them too: they
      # travel with the version.
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # cpal (through rodio) and gilrs ask pkg-config for a system library before
      # a single line of Rust is compiled: `alsa-sys` wants libasound2,
      # `libudev-sys` wants libudev, and the standalone JACK backend needs JACK
      # development files. A runner without those headers fails inside a
      # build script about twenty-five seconds in, and all the log says is cargo's
      # exit code 101. They are not optional here any more than they are on a
      # Linux machine that wants to play sound or read a gamepad.
      - name: System libraries the audio and gamepad backends need
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libjack-jackd2-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy, zero warnings, every target
        run: cargo clippy --all-targets -- -D warnings

      # Members are not all default members. `cargo clippy` with no `-p` follows
      # `default-members` — the engine and its games — so the plugin would join
      # the workspace and be linted by nothing, forever, while `cargo fmt --all`
      # above quietly formatted it as if it were covered. Named here, as
      # `.githooks/pre-commit` names it.
      - name: Clippy, zero warnings, the plugin and its detector
        run: cargo clippy -p nice-tuner -p pitch --all-targets -- -D warnings

      - name: Clippy, zero warnings, the standalone tuner
        run: cargo clippy -p nice-tuner --features standalone --all-targets -- -D warnings

      # The model plugin and the crate the two plugins share. The same omission
      # the comment above describes, found by reading the list rather than
      # trusting it: `nice-nam` and `nice-common` joined as members, never as
      # named ones, so every check in this file and in `.githooks/` passed while
      # compiling neither. `--features standalone` is not on this step, and the two
      # halves of that have different reasons. On Windows the flag means the azo
      # transport, and the `windows` job below is where it is linted, with
      # `--all-features` on the shared crate so nothing in that graph is left out.
      # On Linux it means the ALSA and JACK halves, which are believed to build here
      # and have never been run — see the test step further down — so they stay out
      # of a clippy step too, until someone has seen them green.
      - name: Clippy, zero warnings, the model plugin and the shared crate
        env:
          # Same reason as the test step below: the Linux engine refuses to build
          # at rustc's default x86-64 baseline.
          RUSTFLAGS: "-Ctarget-cpu=x86-64-v3"
        run: cargo clippy -p nice-nam -p nice-common --all-targets -- -D warnings

      # The wah, named by the same logic as its siblings: a member `cargo
      # clippy` with no `-p` would never compile, and the lesson above is
      # that membership is not coverage. No RUSTFLAGS here, unlike the
      # model plugin's step — nice-wah depends on no SIMD engine, and
      # raising the instruction-set floor for nothing is not free.
      - name: Clippy, zero warnings, the wah
        run: cargo clippy -p nice-wah --all-targets -- -D warnings

      # The standalone half, linted like the tuner's beside it: the binary
      # and the audio owner are behind `standalone`, and a step that never
      # turns the feature on would lint a source tree with the app missing
      # from it. ASIO is not fetched here — `asio-host` is a `cfg(windows)`
      # dependency, so this Linux runner does not see it in the graph at all, and
      # nothing in this file vendors an SDK any more.
      - name: Clippy, zero warnings, the standalone wah
        run: cargo clippy -p nice-wah --features standalone --all-targets -- -D warnings

      # The phaser plain, named like the wah's step beside it: the
      # standalone leg below compiles everything except what hides behind
      # `cfg(not(standalone))`, and the plugin's host-facing half is
      # exactly what lives there. No RUSTFLAGS either — the same plain-
      # Rust graph as its sibling.
      - name: Clippy, zero warnings, the phaser
        run: cargo clippy -p nice-phase --all-targets -- -D warnings

      # The phaser's standalone half, linted like the wah's beside it: the
      # binary and the audio owner are behind `standalone`, and a step that
      # never turns the feature on would lint a source tree with the app
      # missing from it. ASIO is not fetched here — `asio-host` is a `cfg(windows)`
      # dependency, invisible to this runner's graph, and nothing in this file
      # vendors an SDK any more.
      - name: Clippy, zero warnings, the standalone phaser
        run: cargo clippy -p nice-phase --features standalone --all-targets -- -D warnings

      # The Pi-Fase, for the reason this file has now learned four times:
      # membership is not coverage, and a member no step names is a member
      # nothing lints. No RUSTFLAGS, same as its three neighbours — nothing in
      # its graph refuses the default baseline, and raising the instruction-set
      # floor for nothing is not free.
      - name: Clippy, zero warnings, the Pi-Fase
        run: cargo clippy -p nice-pi-face --all-targets -- -D warnings

      # Its standalone half, linted beside theirs: the binary and the audio
      # owner live behind `standalone`, and a step that never turns it on would
      # lint a source tree with the application missing from it. ASIO is not
      # fetched here — `asio-host` is a `cfg(windows)` dependency, so this Linux
      # runner does not see it in the graph at all.
      - name: Clippy, zero warnings, the standalone Pi-Fase
        run: cargo clippy -p nice-pi-face --features standalone --all-targets -- -D warnings

      # The Space Echo, named like the four plugins above it for the reason
      # this file has now learned five times. No RUSTFLAGS: the tape path is
      # plain Rust, and nothing in its graph refuses the default baseline.
      - name: Clippy, zero warnings, the Space Echo
        run: cargo clippy -p nice-echo --all-targets -- -D warnings

      # Its standalone half beside theirs: the binary, the audio owner and
      # the settings file live behind `standalone`, and a step that never
      # turns the feature on would lint a source tree with the application
      # missing from it. ASIO is not fetched here — `asio-host` is a
      # `cfg(windows)` dependency, invisible to this runner's graph.
      - name: Clippy, zero warnings, the standalone Space Echo
        run: cargo clippy -p nice-echo --features standalone --all-targets -- -D warnings

      # The Echoplex, named like every plugin above it for the same reason.
      # No RUSTFLAGS: the tape path is plain Rust, and nothing in its graph
      # refuses the default baseline.
      - name: Clippy, zero warnings, the Echoplex
        run: cargo clippy -p nice-ecomplex --all-targets -- -D warnings

      # Its standalone half beside theirs: the binary, the audio owner and
      # the settings file live behind `standalone`, and a step that never
      # turns the feature on would lint a source tree with the application
      # missing from it. ASIO is not fetched here — `asio-host` is a
      # `cfg(windows)` dependency, invisible to this runner's graph.
      - name: Clippy, zero warnings, the standalone Echoplex
        run: cargo clippy -p nice-ecomplex --features standalone --all-targets -- -D warnings

      # The engine's own claim, checked rather than trusted: docs/licensing.md
      # records why these specific lines exist. A published crate that loses
      # assets/fonts/OFL.txt loses the permission to ship a font with it, and
      # nothing else in the build would ever mention that.
      - name: The published crate is the engine and nothing else
        run: |
          cargo package --list --allow-dirty -p frost > files.txt
          for must in assets/fonts/OFL.txt assets/ron/garden.ron LICENSE-MIT LICENSE-APACHE; do
            grep -qx "$must" files.txt || { echo "::error::$must is missing from the package"; exit 1; }
          done
          if grep -E '^assets/(sprites|audio|game|maps|tilesets)/' files.txt; then
            echo '::error::a game asset is being packaged with the engine'
            exit 1
          fi
          if grep -q '^examples/' files.txt; then
            echo '::error::examples are in the package; the include list says otherwise'
            exit 1
          fi

      - name: The engine compiles for the web
        run: cargo check --target wasm32-unknown-unknown -p antifrost

      # `--no-fail-fast` is not a nicety: without it the first failing target
      # hides every target after it, which on this repo means ten of thirteen
      # — the integration tests, `frost_shaders`, `noisefloor`, `sprite_util`
      # and all doc-tests — going unreported behind one red.
      #
      # `--skip backend::tests::` names what this machine cannot judge. That
      # module's guards ask a GPU for numbers and refuse to answer on a chip
      # they have no row for; `docs/benchmarking.md` §37 settled that a ruler
      # walked on one chip judges nothing on another, and a runner's software
      # rasterizer is a chip with no row. Refusing is right for a guard and
      # wrong for a gate, so the gate says outright that it did not ask.
      # Quoted because YAML ends a plain scalar at a colon that ends the line,
      # and a module path ends in one: unquoted, this file is rejected before any
      # job is created and the only sign is a red run that ran for no time at all.
      - name: Tests (GPU tests are compiled but not executed)
        run: "cargo test --no-fail-fast -- --skip backend::tests::"

      # The plugin and its pitch detector, named rather than swept in: the step
      # above follows `default-members` and would pass without compiling the
      # tuner. Enable standalone to cover device validation, audio processing,
      # settings Apply/recovery, and monitoring allocation checks as well.
      # Never execute device/server-dependent tests or machine-speed benchmarks
      # here. Explicit skips also protect the live JACK checks if their local
      # ignore annotations change. All tests still compile and link. Functional
      # tests use generated samples, mock devices and synthetic configuration.
      # Platform-specific checks and bundling remain in the local check scripts.
      - name: Hardware-independent standalone tuner and detector tests
        run: >-
          cargo test --no-fail-fast -p nice-tuner -p pitch --features nice-tuner/standalone --
          --skip search_burst_stays_inside_the_frame_budget
          --skip jack_server_defaults_resolve_without_manual_device_settings
          --skip named_routes_preserve_full_level_on_both_outputs_and_restore_after_failure

      # The model plugin and the shared crate, and this is the step that matters
      # most for them: `nice-nam` splits by platform, so a Linux runner is the
      # only automatic place its NeuralAmpModeler-rs half is compiled at all — the
      # nam-rs half exists solely on a Windows machine, where `.githooks/pre-push`
      # runs the same line for that platform. The gain staging is held to one
      # convention by a test that compares the two engines, and until now neither
      # machine could compile the side it was written against.
      #
      # `--features standalone` is not here for nice-nam, unlike the tuner above:
      # it is believed to build on Linux (the ALSA and JACK libraries this job
      # installs are the ones it needs, and `rfd`'s default backend is the pure
      # Rust portal one), but believed is not run, and a step that turns red for
      # a reason nobody has seen is a step that gets muted. It belongs here once
      # it has been green somewhere. ASIO is not missing from this list by
      # oversight either: `asio-host` is a `cfg(windows)` dependency, so on this
      # runner there is no ASIO transport in the graph to test — and the `windows`
      # job at the end of this file is where it runs, this plugin with `standalone`
      # on and the `cfg(windows)` half of the DSP suite beside it.
      #
      # `RUSTFLAGS` here is the prefix `nice-nam/README.md` already tells a Linux
      # builder to use, and CI is where forgetting it shows up. NeuralAmpModeler-rs
      # refuses to build below its SIMD baseline, and what it examines is the
      # target features rustc enables, not the runner's silicon: a default x86-64
      # target answers it with `fxsr,sse,sse2`, so the build script exits 1 on a
      # machine whose CPU has AVX2 and AVX-512. The flag is set on these two steps
      # rather than in `.cargo/config.toml`, because that file would raise the
      # instruction-set floor for everything else in this repository, antifrost
      # included, and that is a release decision rather than a build fix.
      - name: Tests, the model plugin and the shared crate
        env:
          RUSTFLAGS: "-Ctarget-cpu=x86-64-v3"
        run: |
          cargo test --no-fail-fast -p nice-nam -p nice-common
          cargo test --no-fail-fast -p nice-common --features standalone
          # The shared knob hides behind `widgets`, which neither line
          # above implies; its tests are geometry and nothing else, and
          # no other runner in this file asks for the feature.
          cargo test --no-fail-fast -p nice-common --features widgets

      # The wah, same named-not-swept-in reason as every plugin above, and no
      # RUSTFLAGS for the same opposite reason as its clippy step beside the
      # engine: nothing in its graph refuses the default baseline, and the
      # filter is plain Rust that must build there like everything else. The
      # standalone half runs too, like nice-common's beside it: every test in
      # it is hardware-independent — ring plumbing, settings resolve, the
      # dummy-backend path — and none of them opens a device. The phaser is
      # folded in here for the same reason and by the same two commands as
      # its sibling's: one LFO chain, no device, nothing this runner cannot
      # answer.
      - name: Tests, the wah and the phaser
        run: |
          cargo test --no-fail-fast -p nice-wah
          cargo test --no-fail-fast -p nice-wah --features standalone
          cargo test --no-fail-fast -p nice-phase
          cargo test --no-fail-fast -p nice-phase --features standalone

      # The Pi-Fase, named like every plugin before it. Its suite today is the
      # interface and the plumbing — the fourteen parameters a host sees, the
      # positions each switch claims to have, the settings file's round trip, a
      # frame moved through a real plugin instance by the standalone pump, and
      # `tests/no_alloc.rs` — and none of it opens a device, so the standalone
      # half runs here too. When the filter lands, the acoustics join this step;
      # a Bi-Phase whose tests are only plumbing would be exactly as unverified
      # as a pass-through wearing a nicer README.
      - name: Tests, the Pi-Fase
        run: |
          cargo test --no-fail-fast -p nice-pi-face
          cargo test --no-fail-fast -p nice-pi-face --features standalone

      # The Space Echo, named like every plugin before it. Its suite is the
      # tape path — the mode table the README ships, delay that lengthens as
      # the tape slows, heads that dull with distance, the spring inside its
      # bound, the H/M/L steps from the service notes — plus the host-facing
      # parameter list, the settings round trip, and `tests/no_alloc.rs` as
      # the audio thread's witness. None of it opens a device, so the
      # standalone half runs here too.
      - name: Tests, the Space Echo
        run: |
          cargo test --no-fail-fast -p nice-echo
          cargo test --no-fail-fast -p nice-echo --features standalone

      # The Echoplex, named like every plugin before it. Its suite is the
      # tape path — the delay-range taper and the wow coupled to it, the
      # feedback crossover that stays finite, the tube front end's soft clip,
      # the dry that survives any knob — plus the host-facing parameter list,
      # the settings round trip, and `tests/no_alloc.rs` as the audio thread's
      # witness. None of it opens a device, so the standalone half runs here
      # too.
      - name: Tests, the Echoplex
        run: |
          cargo test --no-fail-fast -p nice-ecomplex
          cargo test --no-fail-fast -p nice-ecomplex --features standalone

      # Compile and link the engine's library tests, including the GPU tree,
      # without executing them on an uncalibrated runner. Compilation errors
      # are failures; GPU runtime measurements remain a local hardware check.
      - name: GPU test tree compiles and links
        run: cargo test -p frost --lib --no-run

  # Windows, in the gate at last.
  #
  # The header of this file tells what took so long. In short: cpal's `asio` feature
  # needed the Steinberg SDK, so a Windows runner could compile this engine and
  # nothing with `--features standalone` — which is why that flag appears in no step
  # above and in no line of `.githooks/` either. The second half is the point:
  # `pre-commit` has always linted this platform's engine and has never linted its
  # audio code, on this machine or any other. Now neither job has to.
  #
  # Every command in this job ran on a Windows machine against this tree before it was
  # written here. That is not ceremony: the two ways this file has failed are both
  # ways of being red for a reason nobody had looked at, and a step no one has run on
  # the platform it names is a step that gets muted the first time it is red.
  windows:
    # Pinned, for the reason the header gives. `windows-latest` names this same
    # Windows Server 2025 image today; the day it stops doing that should reach this
    # file as a commit, the way `ubuntu-latest` moving did.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5

      # The claim this branch makes, checked before anything compiles, and in both
      # directions. `azo` gone from the graph would mean the Windows audio path had
      # quietly left the build — a dependency that is optional and has exactly one
      # `cfg(windows)` edge pointing at it is easy to orphan, and every step below
      # would still pass without it. `asio-sys` back in the graph would mean the SDK
      # was needed again, and a runner that happened to have one would hide that for
      # as long as it kept it. So the graph is read rather than inferred from an exit
      # code: the workspace is printed once and searched, which has the side benefit
      # that a misspelling in this step cannot turn it into a permanent pass.
      #
      # Both variables are named because an image that grew one would make the SDK
      # question unanswerable from here: nothing in this build reads either any more,
      # so a value set is a leftover or a regression, and either is worth saying out
      # loud rather than building over.
      #
      # `shell: pwsh` names what a Windows runner defaults to anyway, instead of
      # assuming it. The script reads cargo's exit codes from $LASTEXITCODE and throws
      # stderr away instead of merging it with `2>&1`, because merging is the one thing
      # Windows PowerShell and PowerShell 7 disagree about — merging turned a clean
      # run into a stack of RemoteException noise the first time this script was tried.
      - name: No Steinberg SDK in this build
        shell: pwsh
        run: |
          foreach ($name in 'CPAL_ASIO_DIR', 'CPAL_ESSDK_DIR') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) {
              Write-Host "::error::$name is set to '$value'. Nothing in this build reads it."
              exit 1
            }
          }
          $tree = cargo tree --workspace --all-features | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cargo tree failed with exit code $LASTEXITCODE; the graph cannot be judged."
            exit 1
          }
          if ($tree -notmatch '\bazo v') {
            Write-Host '::error::azo is not in the graph: the Windows audio path has left the build.'
            exit 1
          }
          if ($tree -match 'asio-sys') {
            Write-Host '::error::asio-sys is back in the graph. It builds the proprietary Steinberg C++ host layers, so any graph containing it needs the SDK the scan above refuses in the tree.'
            exit 1
          }
          Write-Host 'azo carries the ASIO path, asio-sys is gone, and no SDK variable is set.'

      # The other half of the claim, and stated narrowly on purpose because the
      # broad version is false. cpal IS in a Windows build of this workspace:
      # frost plays sounds through rodio, and rodio drives cpal. Measured, not
      # remembered -- `cargo tree -p nice-common --all-features -i cpal --target
      # x86_64-pc-windows-msvc` gives the one path `cpal <- rodio <- frost <-
      # nice-common`. What must not come back is the device code declaring cpal
      # for itself, because that is a second way to open a stream next to the
      # ASIO one, on a second clock, which is the thing this branch removes.
      #
      # `--depth 1 --prefix none` is what makes the claim checkable line by line:
      # cargo prints nice-common and its direct dependencies, unprefixed, one per
      # line. `--target` is the other half -- without it cargo lists every
      # platform's section, and the cfg(not(windows)) cpal this branch empties
      # would show up and read as a failure.
      - name: The Windows audio path declares no cpal
        shell: pwsh
        run: |
          $declared = cargo tree -p nice-common --all-features -e normal,build --depth 1 --prefix none --target x86_64-pc-windows-msvc | Out-String
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cargo tree failed with exit code $LASTEXITCODE; the graph cannot be judged."
            exit 1
          }
          if ($declared -match '(?m)^cpal v') {
            Write-Host '::error::nice-common declares cpal for itself on Windows again. The device transport there is the azo path in nice-common/src/asio_io.rs, and cpal reaching the process through frost and rodio is a different consumer that must stay out of audio_io and devices.'
            exit 1
          }
          Write-Host 'nice-common names no cpal on Windows: azo is the only device API it declares there.'

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          # clippy, and not the rustfmt beside it in the job above: there is no
          # formatting step here for rustfmt to serve, because formatting is
          # platform-blind — the same bytes judged by the same rustfmt, and a second
          # run on Windows would differ only in what the checkout's line endings
          # happen to look like, which is a git setting and not a property of the code.
          # No wasm target either: the engine's web check above does not care which
          # machine ran it.
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # There is deliberately no system-libraries step on this platform. The one in
      # the job above installs the ALSA, udev and JACK headers that cpal, rodio and
      # gilrs ask pkg-config for before cargo compiles anything; here the audio backend
      # is the operating system, and the JACK half is `cfg(target_os = "linux")`, so it
      # is not in this graph to need anything.

      # The engine and its games, on the machine the binaries run on. Two things worth
      # naming about this step. It compiles the half of the graph that only exists
      # here — the window and input plumbing behind `cfg(windows)` and the device
      # panel's WASAPI path — and it compiles and links the engine's test tree, which
      # is what the last step of the job above exists to do: on this platform the GPU
      # tree is checked by `--all-targets`, and running those tests is refused for the
      # §37 reason the job above gives, unchanged.
      - name: Clippy, zero warnings, every target
        run: cargo clippy --all-targets -- -D warnings

      # Named rather than swept in, exactly as above: `cargo clippy` with no `-p`
      # follows `default-members`, and the tuner is not one of them.
      - name: Clippy, zero warnings, the plugin and its detector
        run: cargo clippy -p nice-tuner -p pitch --all-targets -- -D warnings

      # The steps this job was written for. `--features standalone` on the runner above
      # compiles the ALSA and JACK halves; here the same words compile the transport
      # this repository now depends on for all of its Windows audio — `nice_common`'s
      # azo transport, the driver queries behind the settings page, and the two plugins
      # that own their own audio. Neither of the last two has ever been linted by
      # anything automatic, on any platform, before this branch.
      - name: Clippy, zero warnings, the standalone tuner
        run: cargo clippy -p nice-tuner --features standalone --all-targets -- -D warnings

      # No `RUSTFLAGS: -Ctarget-cpu=x86-64-v3` anywhere in this job, unlike two steps
      # above. That flag answers NeuralAmpModeler-rs's refusal of the default x86-64
      # baseline, and NeuralAmpModeler-rs is the Linux half of `nice-nam`; the Windows
      # half is `nam-rs`, which asks nothing of the instruction set. Setting it here
      # would raise the instruction floor of every build on the platform people run the
      # binaries on, for a reason that does not exist on it.
      - name: Clippy, zero warnings, the model plugin and the shared crate
        run: cargo clippy -p nice-nam -p nice-common --all-targets -- -D warnings

      # The shared crate with every feature on, which on this platform is the sentence
      # "with the ASIO transport in it": `asio-host` is a `cfg(windows)` dependency, so
      # `--all-features` on the runner above has never seen it, and it also implies the
      # `standalone` and `widgets` halves that job tests with separate commands.
      - name: Clippy, zero warnings, the shared crate with every feature
        run: cargo clippy -p nice-common --all-features --all-targets -- -D warnings

      # The five plugins that take their audio from `nice_common::audio_io`, plain and
      # standalone. They share two commands here rather than the ten above because
      # the reason for naming them — membership is not coverage — is one reason, not
      # five, and one cargo invocation says it once.
      - name: Clippy, zero warnings, the plugins that use the shared audio
        run: |
          cargo clippy -p nice-wah -p nice-phase -p nice-pi-face -p nice-echo -p nice-ecomplex --all-targets -- -D warnings
          cargo clippy -p nice-wah -p nice-phase -p nice-pi-face -p nice-echo -p nice-ecomplex --features standalone --all-targets -- -D warnings

      # The transport's own tests, and the sample conversions under it: the requests
      # refused before a driver is touched, the one-driver-per-process claim, what a
      # driver is told when it asks whether overload is supported, and one block moved
      # through a real pair of buffers. None of them needs a driver — that was a
      # condition of writing them, because the runner below has no audio hardware
      # either, and a test that only passes on the machine with the interface plugged
      # in tells you about the machine.
      - name: Tests, the shared crate with every feature
        run: cargo test --no-fail-fast -p nice-common --all-features

      # The same three skips as the step of the same name above, and for the same
      # reasons: one of them measures the machine rather than the code, and the other
      # two are JACK. They are written out here too rather than dropped, because a skip
      # that lives in only one of two identical-looking steps is a skip somebody will
      # remove from the wrong file, and then this job goes red on a Thursday.
      - name: Hardware-independent standalone tuner and detector tests
        run: >-
          cargo test --no-fail-fast -p nice-tuner -p pitch --features nice-tuner/standalone --
          --skip search_burst_stays_inside_the_frame_budget
          --skip jack_server_defaults_resolve_without_manual_device_settings
          --skip named_routes_preserve_full_level_on_both_outputs_and_restore_after_failure

      # The step the comment above has been waiting for. `nice-nam` splits by platform:
      # the Linux runner is the only automatic place its NeuralAmpModeler-rs half is
      # compiled, and `tests/dsp_windows.rs` is the twin of that suite for the engine
      # this platform actually ships — `#[cfg(windows)]`, compiling `src/dsp.rs` in
      # place, on the ground that a shipping binary with no DSP tests is unverified
      # however green the other machine is. It has existed since it was written without
      # any automated run, because there was no automated Windows run to be in.
      - name: Tests, the model plugin with its own audio
        run: cargo test --no-fail-fast -p nice-nam --features standalone

      # The five plugins beside it, standalone only: the plain halves of their test
      # suites are the same source the runner above executes, and what differs here is
      # the audio owner behind `standalone` — which on this platform means the settings
      # resolution and frame plumbing that sit on top of the azo transport.
      - name: Tests, the plugins that use the shared audio
        run: cargo test --no-fail-fast -p nice-wah -p nice-phase -p nice-pi-face -p nice-echo -p nice-ecomplex --features standalone

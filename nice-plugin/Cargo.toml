[package]
name = "nice-plugin"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Project-owned nice-plug/baseview/Frost editor and standalone adapters"

[features]
default = []
standalone = ["nice-common/audio-io", "nice-common/asio-host", "dep:plugin-buffer", "dep:crossbeam"]
unsafe = ["dep:window-position", "window-position/unsafe"]

[dependencies]
plugin-buffer = { path = "../nice-tuner/crates/plugin-buffer", optional = true }
crossbeam = { version = "0.8", optional = true }
nice-common = { path = "../nice-common", features = ["widgets"] }
frost = { path = ".." }
baseview = { version = "=0.4.2", features = ["tracing"] }
nice-plug = { version = "0.4.2", default-features = false, features = ["editor", "vst3", "assert_process_allocs"] }
wgpu = "30"
pollster = "0.4"
keyboard-types = "0.8.3"

# The XDND shadow receiver (`src/xdnd.rs`) speaks Xlib directly and reads
# the baseview child's window id through the handle baseview itself
# publishes; both crates are versions already in the lockfile, the same
# x11-dl nice-rack links for its own editor windows.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
x11-dl = "2.21.0"

[target.'cfg(target_os = "macos")'.dependencies]
macos-metal-view = { path = "../nice-common/crates/macos-metal-view" }

[target.'cfg(windows)'.dependencies]
window-position = { path = "../nice-tuner/crates/window-position", optional = true }

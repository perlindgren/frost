[package]
name = "frost"
version = "0.1.0"
edition = "2024"
# Engine-side packages inherit the MIT OR Apache-2.0 metadata below.
# The games have separate notices: antifrost/LICENCE.txt and immortal/LICENCE.txt.
# Cargo metadata does not establish ownership or override component licences.
license.workspace = true
# What a published `frost` would contain: the engine, its shaders, and the
# three files its own `include_bytes!` reaches for. Stated rather than
# defaulted because the default is "everything git tracks" — measured at 372
# files, including sprites, sounds and scenes whose provenance and permissions
# require separate review.
#
# Naming the font does not ship it: `include_bytes!` targets ride along past
# this list whether named or not. Naming `OFL.txt` does. Nothing in any source
# file mentions that text, so an `include` list without it would drop the one
# required licence text. Its presence is one condition of redistribution,
# not proof that every distribution requirement has been met. `assets/fonts/README.txt` is named for the same
# reason: it is the provenance, and provenance is referenced by nobody.
include = [
  "/src",
  "/shaders",
  "/assets/fonts/FiraCode-VariableFont_wght.ttf",
  "/assets/fonts/Leofont-Regular.ttf",
  "/assets/fonts/OFL.txt",
  "/assets/fonts/README.txt",
  "/assets/ron/garden.ron",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/README.md",
]

# The engine plus its tools (docs/tooling.md). The tools are separate
# packages so their dependencies — `clap`, `env_logger`, … — stay out of
# `frost`'s tree; nothing a tool needs is ever added to `[dependencies]`
# below. `cargo build`/`cargo test` from this directory still cover both:
# with a root package, cargo's default would be the root package alone, so
# the members are named explicitly.
#
# `noisefloor` runs the relationship the other way: it needs nothing, and
# `frost`'s benches read it as a dev-dependency, so the witness of a
# measurement travels with the measurement instead of drifting away from it
# in some other package.
# `immortal` is the garden game: 13,135 lines that were an example target of this
# package until its licence became the problem. A directory of a game's own,
# carrying a stranger's art, sitting inside a crate that declares MIT, is the
# arrangement docs/licensing.md exists to warn about — and an example inherits
# whatever its package claims, having no manifest of its own to say otherwise.
# As a member it declares nothing, which is how a package says all rights
# reserved; `publish = false` keeps it out of any tarball.
[workspace]
members = ["antifrost", "frost_shaders", "immortal", "nice-tuner", "nice-nam", "nice-nam/crates/audio-float", "nice-common", "nice-plugin", "nice-common/crates/macos-metal-view", "nice-rack", "nice-wah", "nice-phase", "nice-clone", "nice-dist", "nice-pi-face", "nice-echo", "nice-ecomplex", "nice-rack-engine", "nice-clap-host", "nice-rack/crates/standalone", "nice-rack/crates/window-input", "nice-rack/crates/ipc", "nice-tuner/crates/pitch", "nice-tuner/crates/core-audio-device", "nice-tuner/crates/window-position", "nice-tuner/crates/macos-frame-sync", "nice-tuner/crates/plugin-buffer", "nice-tuner/xtask", "tools/sprite_util", "tools/noisefloor"]
# The plugin is a member and not a default member, which is a deliberate split.
# `members` is what `cargo fmt --all` and the lock resolution cover, so the
# plugin's sources are formatted and versioned with the engine; `default-members`
# is what a bare `cargo build`, `test`, or `clippy` selects, and a plugin GUI
# does not belong in the engine's gate by accident — it builds a `cdylib` under
# nice-plug's `assert_process_allocs`, and its pitch test measures a wall-clock
# budget that only holds with the dev profile below. Those checks run by name:
# `-p nice-tuner -p pitch`, in the hook and in the gate.
default-members = [".", "antifrost", "frost_shaders", "immortal", "tools/sprite_util", "tools/noisefloor"]
# Edition 2024 implies resolver 3; stated explicitly so the workspace
# resolver cannot drift from the packages' editions.
resolver = "3"

# Engine-side packages opt into this Cargo metadata with `license.workspace = true`.
# Omission leaves the metadata unspecified; actual permissions depend on the
# applicable notices, valid grants and law, not on workspace membership.
[workspace.package]
license = "MIT OR Apache-2.0"

[dependencies]
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4.34", features = ["release_max_level_off"] }
# Font parsing, Unicode text shaping and glyph rasterization for
# `Shape::Text`. Pure Rust (the Fontation project); the whole dependency
# tree (skrifa, yazi, zeno) resolves from the local registry cache.
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native audio output for `Audio`/`Sound` (one-shot and looping playback).
# Target-gated because rodio's cpal device layer is native-only; the crate
# must stay buildable for `wasm32-unknown-unknown` (see `text_web`), and the
# audio module itself is `#[cfg(not(target_arch = "wasm32"))]`-gated in
# `src/lib.rs`, so wasm builds never compile rodio.
rodio = "0.23.0"

[target.'cfg(unix)'.dependencies]
# Process liveness for the telling: `kill(pid, 0)` asks whether a pid
# answers without touching the process, which is how a stale card — a
# crashed app — is told from a running one (src/tell.rs). Through the
# crate rather than a hand-written `extern` block for the upstream
# `pid_t`: `kill` reads a negative pid as a whole process *group*, so
# the u32→pid_t widening is a question the type should answer. Gated to
# unix — there are no processes to probe in the browser (the module is
# itself `cfg`-gated out of the wasm build), and Windows has no
# signal-zero to ask (see the `alive` arms in src/tell.rs).

[target.'cfg(target_os = "linux")'.dependencies]
# Native Wayland drop receiving (src/backend/wayland_drop.rs): winit 0.30
# implements file drops only on X11 (XDND), so dropping a plugin onto the
# rack does nothing when KDE runs a native Wayland session. Receiving
# `wl_data_device` offers needs the wire protocol itself, and *this* crate,
# not an example, is the one that owns the window — hence a direct
# dependency, gated to Linux where the gap exists. `features = ["system"]`
# pins the same C-lib backend winit already selects for Wayland (its
# wayland-backend dep enables `client_system`); sharing that choice is the
# contract that lets us read drops off winit's own `wl_display` instead of
# a rival libwayland. Stated by name because a dependency's opinion is not
# a contract. Revisit when winit 0.31 ships native Wayland DnD: the module
# is written to be deleted then.
wayland-client = { version = "0.31", features = ["system"] }
# The handle types behind `winit::window::Window`'s `HasDisplayHandle` /
# `HasWindowHandle` impls; needed by name to reach the `wl_display` and
# `wl_surface` pointers the drop module binds its device against. Already
# in the graph — winit 0.30.13 re-exports its impls from this very crate.
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wall-clock access for `Rng::new` (`Date.now()`): `std::time` is not
# implemented on wasm32-unknown-unknown and calling it aborts the module.
# Already in the dependency graph via web-sys and winit.
js-sys = "0.3"
# Surfaces Rust panics in the browser console instead of the wasm module
# dying silently; the web example installs it before anything else.
console_error_panic_hook = "0.1"
# DOM access for the page's loading placeholder (see `hide_fallback` and
# `show_fallback`); already in the dependency graph via winit, so this adds
# no new crate — just the features we use.
web-sys = { version = "0.3", features = [
    # The resize listener takes a DOM `Event`, the canvas is sized through its
    # element type, and both hang off `EventTarget` — asked for by name because
    # winit enables them today and a dependency's opinion is not a contract.
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Performance",
    # The layout-driven resize path (see `fit_canvas`): the root element's box
    # is watched as well as the window's `resize` event, so a compositor that
    # moves the frame without announcing it still reaches the renderer.
    "ResizeObserver",
    "ResizeObserverEntry",
    # The browser's own memory for the store module (src/store.rs): the
    # per-origin `localStorage` a web build keeps its saves and settings
    # in, where the native store keeps files.
    "Storage",
    "Window",
] }


# The measurement harness, named because it is the one example carrying tests.
# An example's unit tests are not built by `cargo test` unless the target asks:
# `test` defaults to false for examples, so the harness's sixteen tests — the
# median, the provenance probe, the gate that refuses to judge an uncomposited
# window — had never run in any gate until this line. They are the cheapest
# defence the benchmark's honesty has, so the target says so.
[[example]]
name = "benchsuite"
path = "examples/benchsuite/main.rs"
test = true

# The other examples carrying unit tests, named for the same reason and in the
# same one line each. `test` defaults to false for example targets, so `cargo test`
# never built any of these: `courtyard` five, `ron_view` three, `vrr` three, plus
# `centipede`'s fifteen with its own comment above. `immortal` carried 111 and left
# the list the day it became a package; a member's tests are built without being
# asked, which is the whole reason the lift was worth doing before the licence
# argument won on its own.
[[example]]
name = "courtyard"
path = "examples/courtyard.rs"
test = true

[[example]]
name = "ron_view"
path = "examples/ron_view/main.rs"
test = true

[[example]]
name = "vrr"
path = "examples/vrr/main.rs"
test = true

[dev-dependencies]
# Command line parsing for the `repeat` example (`--repeat_x`, `--repeat_y`).
clap = { version = "4", features = ["derive"] }
# Logger initialization for the examples and tests only; the library
# itself just uses the `log` facade, so consumers choose their own.
env_logger = "0.11.11"
# Same naga version wgpu 30.0.1 uses internally, so `cargo test`
# validates the .wgsl files with the exact frontend
# `Device::create_shader_module` runs — no GPU or window required.
naga = { version = "30.0.1", features = ["wgsl-in"] }
# Nothing here serves the game any more: `serde` and `ron` moved to
# `immortal/Cargo.toml` with it, leaving the engine's dev-dependencies to the
# engine. The RON the engine speaks is its own — src/ron.rs, hand-written, no
# external parser — which is why two crates could leave without one `use`
# statement changing anywhere else.

# Cross-platform system clipboard for the `text_input` example's Ctrl-C /
# Ctrl-V; winit 0.30 has no clipboard API of its own. Gated to native
# targets: `arboard` does not compile for `wasm32-unknown-unknown`, and a
# plain dev-dependency is built for *every* example build — which would
# break `cargo build --example <anything> --target wasm32-unknown-unknown`
# (see web/build.sh). `text_input` itself is a native-only example.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
arboard = "3.7.0"
# The noise floor the benches report alongside their numbers
# (tools/noisefloor). Native-only for the arboard reason above — the canary
# measures a scheduler, and a browser tab does not have the one being judged.
noisefloor = { path = "tools/noisefloor" }

# The debug profile's tax on image work: Lanczos3 resizes and PNG
# encoding run an order of magnitude slower unoptimized, and that tax
# is what the suites' cold bakes and a debug session's hill entries
# actually pay — the test tables keep the suite from paying it twice,
# but the first bake of each size, per process, is honest work. The
# dependency gets the optimization; our own code keeps full debug
# detail, line numbers, and stepping.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# The plugin's pitch detector, for the same reason the two above are here and
# with a sharper edge: detection is bursty (one window search per ~85 ms of
# audio) and runs in the editor's frost frame pump — the host's UI thread.
# Measured there, unoptimized a burst costs ~2.3 ms against a 60 fps frame
# budget and optimized ~0.26 ms. It is a `profile.dev.package` pin rather than
# an `opt-level` on the crate so `pitch` keeps its debuginfo and the tuner's own
# code stays debuggable.
#
# A pin in a member manifest is ignored — profiles are read from the workspace
# root and nowhere else — which makes this the one place it can live, and
# `nice-tuner/crates/pitch/tests/callback_budget.rs` the guard that says so:
# without this block that test fails, and fails looking like a flaky timing test
# on a busy machine.
[profile.dev.package.pitch]
opt-level = 3

# The oversampled circuit runs on the audio thread even in a development
# standalone. Keep its fixed-size matrix arithmetic optimized while retaining
# debug information; do not change the other workspace members' build profile.
[profile.dev.package.nice-clone]
opt-level = 2

# Keep circuit-model debug builds usable, as for nice-clone; retain debuginfo.
[profile.dev.package.nice-dist]
opt-level = 2

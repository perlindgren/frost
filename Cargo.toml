[package]
name = "frost"
version = "0.1.0"
edition = "2024"
# The engine is dual licensed, and so is everything engine-side — the shader
# shelf and the tools inherit it from `[workspace.package]` below rather than
# restating it, because four hand-typed copies of a licence are four chances to
# forget one. The games opt out by naming nothing: antifrost and the `immortal`
# example are their own terms, and `docs/licensing.md` is the table of who
# carries what, because a `license` field is a claim about one package's files
# and nothing else.
license.workspace = true
# What a published `frost` would contain: the engine, its shaders, and the
# three files its own `include_bytes!` reaches for. Stated rather than
# defaulted because the default is "everything git tracks" — measured at 372
# files, among them every sprite, sound and scene under `assets/`, most of
# which are a game's art and are not ours to license.
#
# Naming the font does not ship it: `include_bytes!` targets ride along past
# this list whether named or not. Naming `OFL.txt` does. Nothing in any source
# file mentions that text, so an `include` list without it would drop the one
# file that makes redistributing Fira Code lawful — silently, with nothing
# failing anywhere to say so. `assets/fonts/README.txt` is named for the same
# reason: it is the provenance, and provenance is referenced by nobody.
include = [
  "/src",
  "/shaders",
  "/assets/fonts/FiraCode-VariableFont_wght.ttf",
  "/assets/fonts/Leofont-Regular.ttf",
  "/assets/fonts/OFL.txt",
  "/assets/fonts/README.txt",
  "/assets/ron/garden.ron",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/README.md",
]

# The engine plus its tools (docs/tooling.md). The tools are separate
# packages so their dependencies — `clap`, `env_logger`, … — stay out of
# `frost`'s tree; nothing a tool needs is ever added to `[dependencies]`
# below. `cargo build`/`cargo test` from this directory still cover both:
# with a root package, cargo's default would be the root package alone, so
# the members are named explicitly.
#
# `noisefloor` runs the relationship the other way: it needs nothing, and
# `frost`'s benches read it as a dev-dependency, so the witness of a
# measurement travels with the measurement instead of drifting away from it
# in some other package.
[workspace]
members = ["antifrost", "frost_shaders", "tools/sprite_util", "tools/noisefloor"]
default-members = [".", "antifrost", "frost_shaders", "tools/sprite_util", "tools/noisefloor"]
# Edition 2024 implies resolver 3; stated explicitly so the workspace
# resolver cannot drift from the packages' editions.
resolver = "3"

# The engine's own terms, written once. Engine-side packages ask for this with
# `license.workspace = true`; a package that does not ask declares nothing, and
# declaring nothing means all rights reserved. Inheriting is therefore opt-in,
# which is the only reason the default is safe to state: a new game added to
# `members` is not accidentally licensed by a decision it never made.
[workspace.package]
license = "MIT OR Apache-2.0"

[dependencies]
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4.34", features = ["release_max_level_off"] }
# Font parsing, Unicode text shaping and glyph rasterization for
# `Shape::Text`. Pure Rust (the Fontation project); the whole dependency
# tree (skrifa, yazi, zeno) resolves from the local registry cache.
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native audio output for `Audio`/`Sound` (one-shot and looping playback).
# Target-gated because rodio's cpal device layer is native-only; the crate
# must stay buildable for `wasm32-unknown-unknown` (see `text_web`), and the
# audio module itself is `#[cfg(not(target_arch = "wasm32"))]`-gated in
# `src/lib.rs`, so wasm builds never compile rodio.
rodio = "0.23.0"

[target.'cfg(unix)'.dependencies]
# Process liveness for the telling: `kill(pid, 0)` asks whether a pid
# answers without touching the process, which is how a stale card — a
# crashed app — is told from a running one (src/tell.rs). Through the
# crate rather than a hand-written `extern` block for the upstream
# `pid_t`: `kill` reads a negative pid as a whole process *group*, so
# the u32→pid_t widening is a question the type should answer. Gated to
# unix — there are no processes to probe in the browser (the module is
# itself `cfg`-gated out of the wasm build), and Windows has no
# signal-zero to ask (see the `alive` arms in src/tell.rs).

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Wall-clock access for `Rng::new` (`Date.now()`): `std::time` is not
# implemented on wasm32-unknown-unknown and calling it aborts the module.
# Already in the dependency graph via web-sys and winit.
js-sys = "0.3"
# Surfaces Rust panics in the browser console instead of the wasm module
# dying silently; the web example installs it before anything else.
console_error_panic_hook = "0.1"
# DOM access for the page's loading placeholder (see `hide_fallback` and
# `show_fallback`); already in the dependency graph via winit, so this adds
# no new crate — just the features we use.
web-sys = { version = "0.3", features = [
    # The resize listener takes a DOM `Event`, the canvas is sized through its
    # element type, and both hang off `EventTarget` — asked for by name because
    # winit enables them today and a dependency's opinion is not a contract.
    "console",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "Node",
    "Performance",
    # The layout-driven resize path (see `fit_canvas`): the root element's box
    # is watched as well as the window's `resize` event, so a compositor that
    # moves the frame without announcing it still reaches the renderer.
    "ResizeObserver",
    "ResizeObserverEntry",
    # The browser's own memory for the store module (src/store.rs): the
    # per-origin `localStorage` a web build keeps its saves and settings
    # in, where the native store keeps files.
    "Storage",
    "Window",
] }


[package]
name = "frost"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4.34"
# Font parsing, Unicode text shaping and glyph rasterization for
# `Shape::Text`. Pure Rust (the Fontation project); the whole dependency
# tree (skrifa, yazi, zeno) resolves from the local registry cache.
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native audio output for `Audio`/`Sound` (one-shot and looping playback).
# Target-gated because rodio's cpal device layer is native-only; the crate
# must stay buildable for `wasm32-unknown-unknown` (see `text_web`), and the
# audio module itself is `#[cfg(not(target_arch = "wasm32"))]`-gated in
# `src/lib.rs`, so wasm builds never compile rodio.
rodio = "0.22.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Surfaces Rust panics in the browser console instead of the wasm module
# dying silently; the web example installs it before anything else.
console_error_panic_hook = "0.1"
# DOM access for the page's loading placeholder (see `hide_fallback` and
# `show_fallback`); already in the dependency graph via winit, so this adds
# no new crate — just the features we use.
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Performance",
    "Window",
] }

[dev-dependencies]
# Command line parsing for the `repeat` example (`--repeat_x`, `--repeat_y`).
clap = { version = "4", features = ["derive"] }
# Logger initialization for the examples and tests only; the library
# itself just uses the `log` facade, so consumers choose their own.
env_logger = "0.11.11"
# Same naga version wgpu 30.0.1 uses internally, so `cargo test`
# validates the .wgsl files with the exact frontend
# `Device::create_shader_module` runs — no GPU or window required.
naga = { version = "30.0.0", features = ["wgsl-in"] }

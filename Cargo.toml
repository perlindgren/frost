# The centipede lives in the same folder as the monster it is cut from, and
# shares its `assets/sprites`; its gait module sits beside it as `rig.rs`, which
# is where most of this target's tests are — fifteen between the two files, none
# of them built until the line below.
[[example]]
name = "centipede"
path = "examples/dogs_name/centipede.rs"
test = true

# The text-input example lives in the `examples/text/` folder.
[[example]]
name = "text_input"
path = "examples/text/text_input.rs"

# The measurement harness, named because it is the one example carrying tests.
# An example's unit tests are not built by `cargo test` unless the target asks:
# `test` defaults to false for examples, so the harness's sixteen tests — the
# median, the provenance probe, the gate that refuses to judge an uncomposited
# window — had never run in any gate until this line. They are the cheapest
# defence the benchmark's honesty has, so the target says so.
[[example]]
name = "benchsuite"
path = "examples/benchsuite/main.rs"
test = true

# The other four examples carrying unit tests, named for the same reason and in
# the same one line each. `test` defaults to false for example targets, so
# `cargo test` never built any of these: `immortal` carries 111 of them across its
# modules, `centipede` fifteen, `courtyard` five, `ron_view` three, `vrr` three.
# They are unit tests over save snapshots, z-order, the plant's growth table, the
# fall geometry — the arithmetic of a game, which is exactly the kind of thing that
# reads as maintained because the target compiles under `clippy --all-targets` and
# no gate ever reached an assertion in it. `docs/licensing.md` has the count of
# what that cost; these four lines are why it will not recur quietly.
[[example]]
name = "immortal"
path = "examples/immortal/main.rs"
test = true

[[example]]
name = "courtyard"
path = "examples/courtyard.rs"
test = true

[[example]]
name = "ron_view"
path = "examples/ron_view/main.rs"
test = true

[[example]]
name = "vrr"
path = "examples/vrr/main.rs"
test = true

[dev-dependencies]
# Command line parsing for the `repeat` example (`--repeat_x`, `--repeat_y`).
clap = { version = "4", features = ["derive"] }
# Logger initialization for the examples and tests only; the library
# itself just uses the `log` facade, so consumers choose their own.
env_logger = "0.11.11"
# Same naga version wgpu 30.0.1 uses internally, so `cargo test`
# validates the .wgsl files with the exact frontend
# `Device::create_shader_module` runs — no GPU or window required.
naga = { version = "30.0.1", features = ["wgsl-in"] }
# Serialization for the `immortal` example's save/reload: `serde`
# derives the snapshot's data model, and `ron` encodes it as human-
# readable, comment-friendly text on disk.
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Cross-platform system clipboard for the `text_input` example's Ctrl-C /
# Ctrl-V; winit 0.30 has no clipboard API of its own. Gated to native
# targets: `arboard` does not compile for `wasm32-unknown-unknown`, and a
# plain dev-dependency is built for *every* example build — which would
# break `cargo build --example <anything> --target wasm32-unknown-unknown`
# (see web/build.sh). `text_input` itself is a native-only example.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
arboard = "3.7.0"
# The noise floor the benches report alongside their numbers
# (tools/noisefloor). Native-only for the arboard reason above — the canary
# measures a scheduler, and a browser tab does not have the one being judged.
noisefloor = { path = "tools/noisefloor" }

# The debug profile's tax on image work: Lanczos3 resizes and PNG
# encoding run an order of magnitude slower unoptimized, and that tax
# is what the suites' cold bakes and a debug session's hill entries
# actually pay — the test tables keep the suite from paying it twice,
# but the first bake of each size, per process, is honest work. The
# dependency gets the optimization; our own code keeps full debug
# detail, line numbers, and stepping.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

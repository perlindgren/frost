[package]
name = "frost"
version = "0.1.0"
edition = "2024"

[dependencies]
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
log = { version = "0.4.34", features = ["release_max_level_off"] }
# Font parsing, Unicode text shaping and glyph rasterization for
# `Shape::Text`. Pure Rust (the Fontation project); the whole dependency
# tree (skrifa, yazi, zeno) resolves from the local registry cache.
swash = "0.2.10"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native audio output for `Audio`/`Sound` (one-shot and looping playback).
# Target-gated because rodio's cpal device layer is native-only; the crate
# must stay buildable for `wasm32-unknown-unknown` (see `text_web`), and the
# audio module itself is `#[cfg(not(target_arch = "wasm32"))]`-gated in
# `src/lib.rs`, so wasm builds never compile rodio.
rodio = "0.22.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Surfaces Rust panics in the browser console instead of the wasm module
# dying silently; the web example installs it before anything else.
console_error_panic_hook = "0.1"
# DOM access for the page's loading placeholder (see `hide_fallback` and
# `show_fallback`); already in the dependency graph via winit, so this adds
# no new crate — just the features we use.
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Performance",
    "Window",
] }

# The particle examples live in the `examples/particles/` folder. Cargo
# only auto-discovers `examples/*.rs` and `examples/*/main.rs`, so each
# file in the folder is named here explicitly; the example names stay the
# same, so `cargo run --example fountains` (and friends) keeps working.
[[example]]
name = "particles"
path = "examples/particles/particles.rs"

[[example]]
name = "fountains"
path = "examples/particles/fountains.rs"

[[example]]
name = "square_fountains"
path = "examples/particles/square_fountains.rs"

# The lighting examples live in the `examples/lighting/` folder. Cargo
# only auto-discovers `examples/*.rs` and `examples/*/main.rs`, so each
# file in the folder is named here explicitly; the example names stay the
# same, so `cargo run --example lighting` (and friends) keeps working.
[[example]]
name = "lighting"
path = "examples/lighting/lighting.rs"

[[example]]
name = "lit_unlit"
path = "examples/lighting/lit_unlit.rs"

[[example]]
name = "bouncing_lights"
path = "examples/lighting/bouncing_lights.rs"

[[example]]
name = "cone"
path = "examples/lighting/cone.rs"

[[example]]
name = "dawn"
path = "examples/lighting/dawn.rs"

[[example]]
name = "near_sun"
path = "examples/lighting/near_sun.rs"

[[example]]
name = "twostars"
path = "examples/lighting/twostars.rs"

[[example]]
name = "eyes"
path = "examples/lighting/eyes.rs"

[[example]]
name = "eyes_light"
path = "examples/lighting/eyes_light.rs"

[[example]]
name = "occlusion"
path = "examples/lighting/occlusion.rs"

# The layer examples live in the `examples/layers/` folder. Cargo
# only auto-discovers `examples/*.rs` and `examples/*/main.rs`, so each
# file in the folder is named here explicitly; the example names stay the
# same, so `cargo run --example parallax` (and friends) keeps working.
[[example]]
name = "layers"
path = "examples/layers/layers.rs"

[[example]]
name = "parallax"
path = "examples/layers/parallax.rs"

[[example]]
name = "repeat"
path = "examples/layers/repeat.rs"

[dev-dependencies]
# Command line parsing for the `repeat` example (`--repeat_x`, `--repeat_y`).
clap = { version = "4", features = ["derive"] }
# Logger initialization for the examples and tests only; the library
# itself just uses the `log` facade, so consumers choose their own.
env_logger = "0.11.11"
# Same naga version wgpu 30.0.1 uses internally, so `cargo test`
# validates the .wgsl files with the exact frontend
# `Device::create_shader_module` runs — no GPU or window required.
naga = { version = "30.0.0", features = ["wgsl-in"] }

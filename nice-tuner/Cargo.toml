[package]
name = "nice-tuner"
version = "0.1.0"
edition = "2024"
description = "A stringed-instrument tuner plugin with a frost-derived embedded GUI"
license.workspace = true
publish = false

[lib]
# `lib` beside `cdylib` for two reasons: the standalone target links it, and so
# does `tests/rt_handoff_no_alloc.rs` — with `cdylib` alone there is no rlib to
# link and `cargo test -p nice-tuner` builds nothing at all.
crate-type = ["cdylib", "lib"]

[[bin]]
# Must NOT equal the lib target name: on MSVC the linker writes a
# `<name>.pdb` per artifact into target/<profile>/deps/, so a cdylib and an
# exe sharing the base name collide ("output file collision" on
# nice_tuner.pdb). macOS hides this (lib-prefixed dylib, embedded DWARF).
# The collision matters more now that the plugin shares one `target/` with the
# engine and its games: this split is what keeps the plugin's artifacts from
# landing on top of frost's.
name = "nice-tuner-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = []
# frost editor diagnostics in standalone and DAW-hosted builds.
diag = []
# Builds the standalone app binary (src/main.rs): the audio-device backends
# (CPAL and native device queries) arrive with it, so a plain
# `cargo build` of the plugin is a cdylib with no device code of its own.
# What it no longer keeps out is cpal altogether: the engine proper is a
# dependency now, and frost carries rodio (→ cpal) and gilrs on every native
# target for its games' sound and gamepads. The plugin simply never calls
# `frost::Audio::new`; the linker still meets ALSA and udev, on Linux as on
# any other platform where frost plays a sound.
standalone = ["dep:jack", "dep:cpal", "dep:tracing", "dep:tracing-subscriber", "nice-common/ui", "nice-common/standalone", "dep:plugin-buffer", "asio-host"]
# Opt in to native Windows placement inside the wrapper crate only.
# nice-tuner itself always denies unsafe code.
unsafe = ["dep:window-position", "window-position/unsafe"]
# ASIO arrives with `standalone` and nowhere else, through the optional
# `asio-host` dependency declared under cfg(windows) below: a feature cannot
# imply different things per platform, but it can name a dependency that only
# exists on one. There is deliberately no `standalone-asio` to remember, and no
# feature named `asio-host` in this file — the implicit one the dependency
# creates is what `cfg(feature = "asio-host")` reads at the call sites.
#
# Nothing has to be installed for it. The transport is `azo`, whose FFI layer
# declares the ASIO COM interfaces by hand, so there is no Steinberg SDK to
# obtain and no `CPAL_ASIO_DIR` to point at one; `.cargo/config.toml` says why it
# sets nothing. That is also why the gate and the hooks can build this feature
# set on Windows at all — while the host was cpal's, a Windows runner could
# compile this engine and not this.

[dependencies]
nice-common = { path = "../nice-common", features = ["widgets"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
nice-plug = { version = "0.4.2", default-features = false, features = [
    "editor",
    "vst3",
    "tracing-subscriber",
    # Debug-build guard: fails loudly if `process()` allocates.
    "assert_process_allocs",
] }
# Pinned to what nice-plug 0.4.2's byo_gui_wgpu example was built against.
# NOTE: baseview 0.3.7+ moved the WindowHandler trait; nice-plug `main` already
# tracks baseview 0.4.1 — revisit this pin when nice-plug releases again.
baseview = { version = "=0.3.3", features = ["tracing"] }
# The same wgpu the engine builds against, and it has to be: a `wgpu::Surface`
# and `wgpu::Device` cross the boundary into `frost::embedded`, and two copies
# of wgpu would be two types with one name — a type error, not a slower build.
# The lock resolves both to 30.0.1; re-check that after any lock refresh.
wgpu = "30"
pollster = "0.4"
crossbeam = "0.8"
# baseview 0.3.3 does not re-export it; its Event::Keyboard carries this type
keyboard-types = "0.8.3"
# Settings panel persistence (main thread only; never touched by the audio path)
serde = { version = "1", features = ["derive"] }
# The settings panel's device enumeration and the standalone's streams, on the
# platforms that have a cpal host to talk to. Not Windows: there the tuner's
# audio is the azo transport (`standalone-asio` used to be a thing one opted in
# to; ASIO now arrives with `standalone`), and the two cpal streams it would
# build are not in the build at all. Same version nice-plug resolves to.
pitch = { path = "crates/pitch" }
plugin-buffer = { path = "crates/plugin-buffer", optional = true }
# RT↔UI analysis handoff (audio thread: producer; editor frame: consumer).
# Already in the graph via nice-plug standalone. The engine's own rtrb is 0.3,
# a semver-incompatible neighbour: two copies coexist, each used by its own
# side, which is a few kilobytes of ring buffer and nothing worse.
rtrb = "0.4"
# The engine, as a member beside this one. The GUI hands it a surface and drives
# it one `frame()` per redraw; see `frost::embedded`.
frost = { path = ".." }

[target.'cfg(not(windows))'.dependencies]
# cpal with the features nice-common's `devices` also asks for; features are
# additive on the unified dependency graph. See the note in nice-common about
# why a Windows build declares no cpal to add features to.
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Enable JACK with the ordinary standalone build, on Linux only. The optional
# dependency is still activated by `standalone`; plugin-only builds omit it.
cpal = { version = "0.18", features = ["jack"], optional = true }
# Public JACK control API; same version already pulled in by CPAL.
jack = { version = "0.13.5", optional = true }

[target.'cfg(windows)'.dependencies]
# Native placement is implemented only by our opt-in Windows wrapper.
window-position = { path = "crates/window-position", optional = true }
# Named by `standalone` without `dep:`, so that the implicit feature it creates
# is the cfg the ASIO code reads; absent everywhere else, and inert here unless
# `standalone` is on. See `crates/asio-host/src/lib.rs`.
asio-host = { path = "crates/asio-host", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
macos-metal-view = { path = "../nice-common/crates/macos-metal-view" }
macos-frame-sync = { path = "crates/macos-frame-sync" }

[dev-dependencies]
ron = "=0.12.2"
# Safe measurement API for allocation tests; no handwritten allocator hooks.
allocation-counter = "=0.8.1"

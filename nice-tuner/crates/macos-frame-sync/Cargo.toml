[package]
name = "macos-frame-sync"
version = "0.1.0"
edition = "2024"
description = "Safe main-thread display-synchronized callbacks for macOS views"
license.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSRunLoop", "NSString"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CADisplayLink"] }
raw-window-handle = "0.6"

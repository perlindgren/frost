[package]
name = "nice-nam"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A frost GUI demonstrator for a Neural Amp Modeler CLAP/VST3 plugin"
license.workspace = true
publish = false

[[bin]]
name = "nice-nam-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Application-owned standalone host.
standalone = ["nice-settings/ui", "dep:cpal", "dep:jack", "dep:plugin-buffer", "dep:tracing"]
diag = []

[dependencies]
baseview = { version = "=0.3.3", features = ["tracing"] }
wgpu = "30"
pollster = "0.4"
keyboard-types = "0.8.3"
crossbeam = "0.8"
rtrb = "0.4"
cpal = { version = "0.18", optional = true }
plugin-buffer = { path = "../nice-tuner/crates/plugin-buffer", optional = true }
tracing = { version = "0.1", optional = true }
nice-settings = { path = "../nice-settings" }
nice-plug = { version = "0.4.2", default-features = false, features = ["editor", "vst3", "assert_process_allocs"] }
frost = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust File Dialog: model and cabinet pickers will run on the UI thread.
rfd = "=0.17.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Single inference, mono duplicated to stereo; do not enable dual-mono.
audio-float = { path = "crates/audio-float" }
nam_engine = { package = "NeuralAmpModeler-rs", version = "=2.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# Reserved for the Windows implementation; processing remains a stub initially.
nam_windows = { package = "nam-rs", version = "=0.4.0" }

[target.'cfg(target_os = "macos")'.dependencies]
macos-frame-sync = { path = "../nice-tuner/crates/macos-frame-sync" }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack"], optional = true }
jack = { version = "0.13.5", optional = true }

[dev-dependencies]
allocation-counter = "=0.8.1"

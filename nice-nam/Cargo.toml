[package]
name = "nice-nam"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A frost GUI demonstrator for a Neural Amp Modeler CLAP/VST3 plugin"
license.workspace = true
publish = false

[[bin]]
name = "nice-nam-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Application-owned standalone host. ASIO comes with it on Windows, through the
# optional `asio-host` dependency below, and is absent on every other platform.
standalone = ["nice-common/ui", "nice-common/standalone", "dep:cpal", "dep:jack", "dep:plugin-buffer", "dep:tracing", "asio-host"]
# Native Windows placement for the standalone window: open where the last session
# left it, or centred in the primary work area when no position was ever stored.
# The unsafe code stays inside the wrapper crate; nice-nam keeps denying it, and a
# window inside a host is never touched — the host owns its children.
unsafe = ["dep:window-position", "window-position/unsafe"]
diag = []

[dependencies]
baseview = { version = "=0.3.3", features = ["tracing"] }
wgpu = "30"
pollster = "0.4"
keyboard-types = "0.8.3"
crossbeam = "0.8"
rtrb = "0.4"
cpal = { version = "0.18", optional = true }
plugin-buffer = { path = "../nice-tuner/crates/plugin-buffer", optional = true }
tracing = { version = "0.1", optional = true }
nice-common = { path = "../nice-common", features = ["widgets"] }
nice-plug = { version = "0.4.2", default-features = false, features = ["editor", "vst3", "assert_process_allocs"] }
frost = { path = ".." }
serde = { version = "1", features = ["derive"] }
# Rust File Dialog: model and cabinet pickers will run on the UI thread.
rfd = "=0.17.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Single inference, mono duplicated to stereo; do not enable dual-mono.
audio-float = { path = "crates/audio-float" }
nam_engine = { package = "NeuralAmpModeler-rs", version = "=2.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# The Windows engine: no cabinet, and a model asking for another sample rate is
# refused rather than run at the wrong one.
nam_windows = { package = "nam-rs", version = "=0.4.0" }
# ASIO in a Windows standalone build's device list, and nothing anywhere else:
# `standalone` names it, and this section means no other platform can see it.
asio-host = { path = "../nice-tuner/crates/asio-host", optional = true }
# Placement is implemented only by our opt-in Windows wrapper, which is also the
# only place in this build that contains unsafe code.
window-position = { path = "../nice-tuner/crates/window-position", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
macos-frame-sync = { path = "../nice-tuner/crates/macos-frame-sync" }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack"], optional = true }
jack = { version = "0.13.5", optional = true }

[dev-dependencies]
ron = "=0.12.2"
# NAM model fixtures use the model format, independently of RON settings.
serde_json = "1"
allocation-counter = "=0.8.1"

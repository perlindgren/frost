[package]
name = "nice-nam"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A frost GUI demonstrator for a Neural Amp Modeler CLAP/VST3 plugin"
license.workspace = true
publish = false

[[bin]]
name = "nice-nam-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
# Application-owned standalone host. ASIO comes with it on Windows, and is
# absent on every other platform; the alias below says how a feature that cannot
# be platform-specific manages that.
standalone = ["nice-plugin/standalone", "nice-common/ui", "nice-common/standalone", "dep:cpal", "dep:jack", "dep:plugin-buffer", "dep:tracing", "asio-host"]
# The name `src/standalone/audio.rs` gates its ASIO halves on, in the spelling
# nice-common gates its own with: `all(windows, feature = "asio-host")`. An alias
# and not a dependency, because the scoping belongs with the thing scoped — `azo`
# is declared under `cfg(windows)` in nice-common, so switching this on off
# Windows pulls no ASIO code, and no carrier crate is needed to keep it out.
asio-host = ["nice-common/asio-host"]
# Native Windows placement for the standalone window: open where the last session
# left it, or centred in the primary work area when no position was ever stored.
# The unsafe code stays inside the wrapper crate; nice-nam keeps denying it, and a
# window inside a host is never touched — the host owns its children.
unsafe = ["nice-plugin/unsafe"]
diag = []

[dependencies]
nice-plugin = { path = "../nice-plugin" }
crossbeam = "0.8"
rtrb = "0.4"
plugin-buffer = { path = "../nice-tuner/crates/plugin-buffer", optional = true }
tracing = { version = "0.1", optional = true }
nice-common = { path = "../nice-common", features = ["widgets"] }
nice-plug = { version = "0.4.2", default-features = false, features = ["editor", "vst3", "assert_process_allocs"] }
frost = { path = ".." }
serde = { version = "1", features = ["derive"] }
# Rust File Dialog: model and cabinet pickers will run on the UI thread.
rfd = "=0.17.2"
# Single inference, mono duplicated to stereo; do not enable dual-mono.
# Every target now needs it: it wraps the flush-to-zero window around the
# engine's kernels, and the engine now runs on Windows too.
audio-float = { path = "crates/audio-float" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nam_engine = { package = "NeuralAmpModeler-rs", version = "=2.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# The same engine the other platforms run, from the branch its Windows backend
# lives on. The 2.0.0 above predates it — the Win32 `MirroredBuffer`
# (`VirtualAlloc2` + `MapViewOfFile3`) landed with 3.0.0, and 3.0.0 is not
# published, so this is the only NAM engine this build can have on this platform
# and it comes from git. `Cargo.lock` pins the commit (dc824177). The key cannot
# be `nam_engine`: cargo refuses one dependency name resolving to two sources
# across targets, which is what keeping macOS and Linux on the published 2.0.0
# means. It also means the x86-64-v3 baseline the engine demands is now a Windows
# build requirement, not only a Linux one.
#
# Remove this the moment the engine is released. When 3.0.0 (or anything after
# it) reaches the registry, this section collapses back into `nam_engine` with a
# version where the rev now stands, and what disappears with the second name is
# the second version of one crate in `Cargo.lock`, the `cfg(windows)` seams in
# `src/dsp.rs` and `tests/dsp.rs`, and the reason the Windows build is pinned to
# a moving branch rather than to a number anyone can re-resolve. Until that
# release exists, this commit is what a Windows build of this plugin is.
nam_windows = { package = "NeuralAmpModeler-rs", git = "https://github.com/fabiohl/NeuralAmpModeler-rs", rev = "dc82417778ffdead48a4a69d5f4e90309ec4c28d", default-features = false }

[target.'cfg(not(windows))'.dependencies]
# The CoreAudio/ALSA/JACK road. On Windows the model runs on the ASIO driver
# through `asio_io` — one clock for the input from the guitar and the output to
# the amp — so this crate declares no cpal there either, as `nice-common`
# explains.
cpal = { version = "0.18", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack"], optional = true }
jack = { version = "0.13.5", optional = true }

[dev-dependencies]
ron = "=0.12.2"
# NAM model fixtures use the model format, independently of RON settings.
serde_json = "1"
allocation-counter = "=0.8.1"

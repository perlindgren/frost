[package]
name = "nice-common"
version = "0.1.0"
edition = "2024"
description = "Shared settings, device discovery and standalone host machinery for frost plugins"
license.workspace = true
publish = false

[features]
default = []
ui = ["devices", "dep:frost", "dep:crossbeam"]
devices = ["dep:cpal", "dep:jack", "dep:core-audio-device"]
asio-host = ["devices", "cpal/asio", "dep:asio-sys"]
# The parts a standalone application needs from its host: the command endpoint
# between panel and audio owner, and the rate conversion the plugin never sees.
standalone = ["dep:crossbeam", "dep:rtrb"]

[dependencies]
frost = { path = "..", optional = true }
crossbeam = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack"], optional = true }
jack = { version = "0.13.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-audio-device = { path = "../nice-tuner/crates/core-audio-device", optional = true }

[target.'cfg(windows)'.dependencies]
asio-sys = { version = "0.4", optional = true }

[dev-dependencies]
# Safe measurement API for the allocation witness; no handwritten allocator hooks.
allocation-counter = "=0.8.1"
# The test drives the converter through the same ring buffer the callback uses.
rtrb = "0.4"

# The converter exists only for a standalone host, so the target that measures it
# names the feature that carries it.
[[test]]
name = "resample_never_allocates"
required-features = ["standalone"]

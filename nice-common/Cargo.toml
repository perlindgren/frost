[package]
name = "nice-common"
version = "0.1.0"
edition = "2024"
description = "Shared settings, device discovery and standalone host machinery for frost plugins"
license.workspace = true
publish = false

[features]
default = []
audio-io = ["devices", "standalone"]
widgets = ["dep:frost"]
ui = ["devices", "widgets", "dep:crossbeam"]
devices = ["dep:cpal", "dep:jack", "dep:core-audio-device"]
asio-host = ["devices", "dep:azo", "dep:crossbeam"]
# The parts a standalone application needs from its host: the command endpoint
# between panel and audio owner, and the rate conversion the plugin never sees.
standalone = ["dep:crossbeam", "dep:rtrb"]

[dependencies]
frost = { path = "..", optional = true }
crossbeam = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
ron = "=0.12.2"
cpal = { version = "0.18", optional = true }
rtrb = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["jack"], optional = true }
jack = { version = "0.13.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-audio-device = { path = "../nice-tuner/crates/core-audio-device", optional = true }

[target.'cfg(windows)'.dependencies]
# `azo` declares the ASIO COM interfaces itself instead of compiling Steinberg's
# headers, so a driver can be asked what it can do and then driven with no SDK,
# no `CPAL_ASIO_DIR`, no libclang and no C compiler — see the note in
# `.cargo/config.toml` for what the SDK route used to cost, and `asio_io` for the
# transport that replaced the one riding on cpal.
#
# `host` is what adds azo's pump thread, and the transport needs it: a driver is
# loaded for the whole session, its apartment belongs on a thread of its own
# rather than on the rack's UI thread, and every call is answered by the thread
# that made the instance. Both features are named rather than inherited from
# `default`, so a new default in a later azo arrives by decision and not by
# update.
azo = { version = "0.6.1", default-features = false, features = [
  "host",
], optional = true }

[dev-dependencies]
# Safe measurement API for the allocation witness; no handwritten allocator hooks.
allocation-counter = "=0.8.1"
# The test drives the converter through the same ring buffer the callback uses.
rtrb = "0.4"

# The converter exists only for a standalone host, so the target that measures it
# names the feature that carries it.
[[test]]
name = "resample_never_allocates"
required-features = ["standalone"]

[package]
name = "nice-rack"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "Foundation for a frost CLAP/VST3 rack host"

[dependencies]
winit = "0.30.13"
rack-window-input = { path = "crates/window-input" }
nice-common = { path = "../nice-common", features = ["ui", "audio-io", "asio-host"] }
nice-rack-engine = { path = "../nice-rack-engine" }
serde = { version = "1", features = ["derive"] }

nice-clap-host = { path = "../nice-clap-host" }
frost = { path = ".." }
crossbeam = "0.8"

# The X11 editor shim speaks Xlib directly (see `src/editors/x11.rs`);
# winit already resolves this exact crate into the Linux binary, so this
# only names the dependency the shim actually uses.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21.0"

[dev-dependencies]
rtrb = "0.4"

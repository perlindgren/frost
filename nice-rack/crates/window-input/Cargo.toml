[package]
name = "rack-window-input"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Speaks the X11 wire protocol itself, so the pointer query needs no libX11 at
# runtime. Same version winit already builds; no features, which adds nothing
# to the lock.
x11rb = "0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
